[project]
name = "kikamba-corpus"
version = "0.1.0"
description = "License-tracked Kikamba (Kamba, kam) text corpus + SentencePiece subword models for Kikamba NLP"
readme = "README.md"
requires-python = ">=3.11,<3.13"
dependencies = [
    "requests>=2.31",
    "pyarrow>=15",
    "ftfy>=6.1",
    "beautifulsoup4>=4.12",
    "datasketch>=1.6",
    "fasttext-wheel>=0.9.2",
    "numpy<2",
    "sentencepiece>=0.2",
    "regex>=2023.0",
    "tqdm>=4.66",
]

[project.scripts]
corpus = "kikamba_corpus.cli:main"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["uv_build>=0.12.19,<0.13.0"]
build-backend = "uv_build"

[tool.pytest.ini_options]
testpaths = ["tests"]
